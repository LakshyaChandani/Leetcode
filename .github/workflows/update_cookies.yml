name: Update Leetcode Cookies

on:
  workflow_dispatch: # Allows you to run it manually to test
  schedule:
    - cron: "0 0 */14 * *" # Runs automatically every 14 days

jobs:
  update_cookies:
    runs-on: ubuntu-latest
    steps:
      - name: Update Leetcode cookies
        uses: vishrutkmr7/UpdateLCCookies@main
        with:
          github-token: ${{ secrets.GH_PAT }}
          leetcode-email: ${{ secrets.LEETCODE_EMAIL }}
          leetcode-password: ${{ secrets.LEETCODE_PASSWORD }}
