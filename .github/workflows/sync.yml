name: Sync LeetCode Submissions

on:
  workflow_dispatch: # Allows you to run this manually at any time
  schedule:
    - cron: '0 8 * * *' # Runs automatically every day at 8:00 AM UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Open Repository
        uses: actions/checkout@v4

      - name: Sync Submissions
        uses: joshcai/leetcode-sync@v1.7.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: 'submissions' # Code will be saved here
          # Optional: choose your preferred language extension formatting if needed
